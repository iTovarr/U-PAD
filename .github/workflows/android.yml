name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      # El google-services.json real no se versiona. Para compilar basta con uno
      # de relleno: la CI no ejecuta la app ni se conecta a Firebase.
      - name: Crear google-services.json de relleno
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "upad-ci",
              "storage_bucket": "upad-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.example.upad" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "CI_PLACEHOLDER" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
